<?xml version="1.0" encoding="UTF-8"?>
<!-- Forma "shield" na cor black (#1c1f24).
     Um arquivo por combinacao forma+cor: o nome do icone e' sempre estatico,
     entao a bandeja nunca precisa reler um arquivo cujo conteudo mudou -- que
     e' justamente quando o cache dela devolve o desenho antigo. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <path d="M11 2.4 18.4 5.2v6c0 4.3-3.1 7.4-7.4 8.4-4.3-1-7.4-4.1-7.4-8.4v-6z"
        fill="none" stroke="#1c1f24" stroke-width="1.9" stroke-linejoin="round"/>
  <polyline points="7.6,11 10,13.4 14.6,8.2" fill="none" stroke="#1c1f24"
        stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
