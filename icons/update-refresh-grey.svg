<?xml version="1.0" encoding="UTF-8"?>
<!-- Forma "refresh" na cor grey (#95a5a6).
     Um arquivo por combinacao forma+cor: o nome do icone e' sempre estatico,
     entao a bandeja nunca precisa reler um arquivo cujo conteudo mudou -- que
     e' justamente quando o cache dela devolve o desenho antigo. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <g fill="none" stroke="#95a5a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18.6 11a7.6 7.6 0 1 1-2.23-5.37"/>
    <polyline points="18.6,3.4 18.6,7.6 14.4,7.6"/>
    <line x1="11" y1="7.6" x2="11" y2="13.6"/>
    <polyline points="8.4,11.2 11,13.8 13.6,11.2"/>
  </g>
</svg>
