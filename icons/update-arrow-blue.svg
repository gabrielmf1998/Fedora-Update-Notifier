<?xml version="1.0" encoding="UTF-8"?>
<!-- Forma "arrow", cor blue (#3b9dff). Um arquivo por combinacao de forma e cor,
     para que o nome do icone seja sempre estatico. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <g fill="none" stroke="#3b9dff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="4.4,12.6 4.4,17.6 17.6,17.6 17.6,12.6"/>
    <polyline points="7.4,9.4 11,13 14.6,9.4"/>
    <line x1="11" y1="3.4" x2="11" y2="12.4"/>
  </g>
</svg>
