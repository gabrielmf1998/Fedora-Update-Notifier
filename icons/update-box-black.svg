<!-- Forma "box" na cor black (#1c1f24).
     Um arquivo por combinacao forma+cor: o nome do icone e' sempre estatico,
     entao a bandeja nunca precisa reler um arquivo cujo conteudo mudou -- que
     e' justamente quando o cache dela devolve o desenho antigo. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <g fill="none" stroke="#1c1f24" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round">
    <path d="M11 2.6 19 6.6v8.8L11 19.4 3 15.4V6.6z"/>
    <path d="M3 6.6 11 10.6 19 6.6"/><path d="M11 10.6v8.8"/>
  </g>
</svg>
