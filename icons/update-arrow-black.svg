<?xml version="1.0" encoding="UTF-8"?>
<!-- Forma "arrow" na cor black (#1c1f24).
     Um arquivo por combinacao forma+cor: o nome do icone e' sempre estatico,
     entao a bandeja nunca precisa reler um arquivo cujo conteudo mudou -- que
     e' justamente quando o cache dela devolve o desenho antigo. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <g fill="none" stroke="#1c1f24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="4.4,12.6 4.4,17.6 17.6,17.6 17.6,12.6"/>
    <polyline points="7.4,9.4 11,13 14.6,9.4"/>
    <line x1="11" y1="3.4" x2="11" y2="12.4"/>
  </g>
</svg>
